name: Build Nexa AfriTech Electric Man

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Donner les permissions à Gradle
        run: chmod +x gradlew

      - name: Compiler l'application
        run: ./gradlew :application:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaAfriTech-Electric-Man-debug
          path: application/build/outputs/apk/debug/*.apk
