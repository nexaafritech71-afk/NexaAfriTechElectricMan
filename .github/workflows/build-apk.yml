name: Construire Nexa AfriTech Electric   

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Donner les permissions à Gradle
        run: chmod +x ./gradlew

      - name: Construire l'APK
        run: ./gradlew :application:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaAfriTech-Electric-APK
          path: app/build/outputs/apk/debug/app-debug.apk
